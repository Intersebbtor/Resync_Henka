# Builds the debug APK and runs the unit tests on every push and pull request, so a change that doesn't compile
# or breaks a test shows up before it's merged, not when the next release tag fails.
#
# The debug APK is kept as a workflow artifact for a week, handy for trying a branch on a phone.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-removed "tools" package, which current sdkmanager rejects.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only the main branch writes the Gradle cache; other branches and PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: resync/app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resync-debug-${{ github.sha }}
          path: resync/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
